apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cashflow-train-srini
  annotations:
    scenarios.ai.sap.com/description: "Cashflow forecasting on financial time-series data"
    scenarios.ai.sap.com/name: "cashflow-forecast"
    executables.ai.sap.com/description: "Train cashflow forecasting model from HANA-backed dataset using AutoTS"
    executables.ai.sap.com/name: "cashflow-train-executable"
    artifacts.ai.sap.com/trained_model.kind: "model"
  labels:
    scenarios.ai.sap.com/id: "cashflow-forecast"
    ai.sap.com/version: "0.3.0"
spec:
  imagePullSecrets:
    - name: docker-hub-srini117us
  entrypoint: train-pipeline
  arguments:
    parameters:
      - name: model_type
        value: "autots"
  templates:
    - name: train-pipeline
      inputs:
        parameters:
          - name: model_type
      outputs:
        artifacts:
          - name: trained_model
            path: /app/output
            archive:
              none: {}
      container:
        image: docker.io/srini117us/cashflow-train:0.3
        command: ["python", "/app/train.py"]
        env:
          - name: MODEL_TYPE
            value: "{{inputs.parameters.model_type}}"
          - name: OUTPUT_DIR
            value: "/app/output"
          - name: FORECAST_HORIZON
            value: "14"
          - name: HANA_HOST
            valueFrom:
              secretKeyRef:
                name: hana-cashflow-creds
                key: host
          - name: HANA_PORT
            valueFrom:
              secretKeyRef:
                name: hana-cashflow-creds
                key: port
          - name: HANA_USER
            valueFrom:
              secretKeyRef:
                name: hana-cashflow-creds
                key: user
          - name: HANA_PASSWORD
            valueFrom:
              secretKeyRef:
                name: hana-cashflow-creds
                key: password
          - name: HANA_SCHEMA
            valueFrom:
              secretKeyRef:
                name: hana-cashflow-creds
                key: schema