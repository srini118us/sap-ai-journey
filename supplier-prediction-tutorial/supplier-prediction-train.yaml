apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: supplier-prediction-train-srini
  annotations:
    scenarios.ai.sap.com/description: "Train XGBoost classifier for supplier on-time delivery"
    scenarios.ai.sap.com/name: "Supplier Prediction (Tutorial)"
    executables.ai.sap.com/description: "Train XGBoost on synthetic procurement data"
    executables.ai.sap.com/name: "supplier-prediction-train"
  labels:
    scenarios.ai.sap.com/id: "supplier-prediction-tutorial"
    ai.sap.com/version: "1.0"
spec:
  imagePullSecrets:
    - name: docker-hub-srini117us
  entrypoint: supplier-pipeline
  templates:
    - name: supplier-pipeline
      steps:
        - - name: trainstep
            template: train-template
    - name: train-template
      container:
        image: docker.io/srini117us/supplier-prediction-train:01
        command: ["/bin/sh", "-c"]
        args:
          - "python /app/src/train.py"
