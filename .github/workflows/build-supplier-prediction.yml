name: Build and Push Supplier Prediction Images

on:
  push:
    branches:
      - master
    paths:
      - 'supplier-prediction-tutorial/**'
      - '.github/workflows/build-supplier-prediction.yml'
  workflow_dispatch:

jobs:
  build-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push training image
        uses: docker/build-push-action@v5
        with:
          context: ./supplier-prediction-tutorial/training
          file: ./supplier-prediction-tutorial/training/Dockerfile
          push: true
          tags: |
            docker.io/srini117us/supplier-prediction-train:01
            docker.io/srini117us/supplier-prediction-train:latest
          cache-from: type=gha,scope=training
          cache-to: type=gha,mode=max,scope=training

  build-serving:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push serving image
        uses: docker/build-push-action@v5
        with:
          context: ./supplier-prediction-tutorial/serving
          file: ./supplier-prediction-tutorial/serving/Dockerfile
          push: true
          tags: |
            docker.io/srini117us/supplier-prediction-serve:01
            docker.io/srini117us/supplier-prediction-serve:latest
          cache-from: type=gha,scope=serving
          cache-to: type=gha,mode=max,scope=serving
