apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: supplier-prediction-serve-srini
  annotations:
    scenarios.ai.sap.com/description: "Serve XGBoost supplier prediction via FastAPI"
    scenarios.ai.sap.com/name: "Supplier Prediction (Tutorial)"
    executables.ai.sap.com/description: "FastAPI inference endpoint for supplier prediction"
    executables.ai.sap.com/name: "supplier-prediction-serve"
    artifacts.ai.sap.com/supplier_model.kind: "model"
  labels:
    scenarios.ai.sap.com/id: "supplier-prediction-tutorial"
    ai.sap.com/version: "1.0"
spec:
  inputs:
    artifacts:
      - name: supplier_model
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      labels: |
        ai.sap.com/resourcePlan: infer.s
    spec: |
      predictor:
        imagePullSecrets:
          - name: docker-hub-srini117us
        minReplicas: 1
        maxReplicas: 1
        containers:
        - name: kserve-container
          image: "docker.io/srini117us/supplier-prediction-serve:01"
          ports:
            - containerPort: 9001
              protocol: TCP
          env:
            - name: STORAGE_URI
              value: "{{inputs.artifacts.supplier_model}}"
            - name: MODEL_DIR
              value: /mnt/models
            - name: MODEL_NAME
              value: supplier-prediction
