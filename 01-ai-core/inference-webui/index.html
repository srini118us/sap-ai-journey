<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor | SAP AI Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #00d4ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
        }

        .card {
            background: #1e2a3a;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            color: #00d4ff;
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #aaa;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input, select {
            padding: 12px 15px;
            border: 2px solid #2d3e50;
            border-radius: 8px;
            background: #0d1520;
            color: #fff;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        input::placeholder {
            color: #555;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #000;
            font-weight: bold;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        /* Result Section */
        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .risk-badge {
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .risk-low {
            background: linear-gradient(135deg, #00c853 0%, #009624 100%);
            color: #fff;
        }

        .risk-medium {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #000;
        }

        .risk-high {
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            color: #fff;
        }

        .prediction-text {
            color: #fff;
        }

        .prediction-text h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .prediction-text p {
            color: #888;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: #0d1520;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
        }

        .stat-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Features Used */
        .features-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .feature-tag {
            background: #2d3e50;
            color: #00d4ff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Error State */
        .error-message {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid #ff5252;
            color: #ff5252;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        footer {
            text-align: center;
            color: #555;
            margin-top: 30px;
            font-size: 0.85rem;
        }

        footer a {
            color: #00d4ff;
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 Customer Churn Predictor</h1>
            <p class="subtitle">Powered by SAP AI Core | Random Forest Model</p>
        </header>

        <!-- Input Form -->
        <div class="card">
            <h2 class="card-title">📊 Customer Details</h2>
            <form id="predictionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="monthlySpend">Monthly Spend ($)</label>
                        <input type="number" id="monthlySpend" placeholder="e.g., 85.50" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="tenureMonths">Tenure (Months)</label>
                        <input type="number" id="tenureMonths" placeholder="e.g., 24" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="supportTickets">Support Tickets</label>
                        <input type="number" id="supportTickets" placeholder="e.g., 2" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="contractType">Contract Type</label>
                        <select id="contractType" required>
                            <option value="">Select contract type</option>
                            <option value="monthly">Monthly</option>
                            <option value="annual">Annual</option>
                        </select>
                    </div>
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn btn-primary" id="predictBtn">
                        <span id="btnText">🚀 Predict Churn</span>
                        <div class="spinner" id="spinner" style="display: none;"></div>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="fillSampleData()">
                        📝 Load Sample Data
                    </button>
                </div>
            </form>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <!-- Result Section -->
        <div class="card result-section" id="resultSection">
            <h2 class="card-title">🎯 Prediction Result</h2>
            <div class="result-header">
                <div class="risk-badge" id="riskBadge">-</div>
                <div class="prediction-text">
                    <h2 id="predictionTitle">-</h2>
                    <p id="predictionSubtitle">-</p>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="churnProbability">-</div>
                    <div class="stat-label">Churn Probability</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="churnPrediction">-</div>
                    <div class="stat-label">Prediction</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="modelVersion">-</div>
                    <div class="stat-label">Model Version</div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <label style="color: #888; font-size: 0.9rem;">Features Used:</label>
                <div class="features-list" id="featuresList"></div>
            </div>
        </div>

        <!-- Sample Profiles -->
        <div class="card">
            <h2 class="card-title">👥 Quick Test Profiles</h2>
            <div class="btn-container" style="flex-wrap: wrap;">
                <button class="btn btn-secondary" onclick="loadProfile('loyal')">😊 Loyal Customer</button>
                <button class="btn btn-secondary" onclick="loadProfile('atrisk')">⚠️ At-Risk Customer</button>
                <button class="btn btn-secondary" onclick="loadProfile('highrisk')">🔴 High-Risk Customer</button>
            </div>
        </div>

        <footer>
            <p>SAP AI Core MLOps Lab 5 | <a href="https://github.com/srini118us/sap-ai-journey" target="_blank">GitHub Repository</a></p>
            <p>Deployment ID: d74ee8a32f950025</p>
        </footer>
    </div>

    <script>
        // API Configuration
        const API_URL = 'http://localhost:3000/predict';

        // Sample profiles for testing
        const profiles = {
            loyal: {
                monthlySpend: 150.00,
                tenureMonths: 48,
                supportTickets: 1,
                contractType: 'annual'
            },
            atrisk: {
                monthlySpend: 45.00,
                tenureMonths: 6,
                supportTickets: 4,
                contractType: 'monthly'
            },
            highrisk: {
                monthlySpend: 25.00,
                tenureMonths: 3,
                supportTickets: 8,
                contractType: 'monthly'
            }
        };

        // Load a profile
        function loadProfile(type) {
            const profile = profiles[type];
            document.getElementById('monthlySpend').value = profile.monthlySpend;
            document.getElementById('tenureMonths').value = profile.tenureMonths;
            document.getElementById('supportTickets').value = profile.supportTickets;
            document.getElementById('contractType').value = profile.contractType;
        }

        // Fill sample data
        function fillSampleData() {
            loadProfile('atrisk');
        }

        // Form submission
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('predictBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const errorMessage = document.getElementById('errorMessage');
            const resultSection = document.getElementById('resultSection');

            // Get form values
            const customerData = {
                monthly_spend: parseFloat(document.getElementById('monthlySpend').value),
                tenure_months: parseInt(document.getElementById('tenureMonths').value),
                support_tickets: parseInt(document.getElementById('supportTickets').value),
                contract_type: document.getElementById('contractType').value
            };

            // Show loading state
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            errorMessage.classList.remove('show');
            resultSection.classList.remove('show');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ customers: [customerData] })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                displayResult(data);

            } catch (error) {
                console.error('Prediction error:', error);
                errorMessage.textContent = `❌ Error: ${error.message}. Make sure the proxy server is running (node server.js)`;
                errorMessage.classList.add('show');
            } finally {
                btn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        });

        // Display prediction result
        function displayResult(data) {
            const prediction = data.predictions[0];
            const resultSection = document.getElementById('resultSection');
            
            // Risk badge
            const riskBadge = document.getElementById('riskBadge');
            riskBadge.textContent = prediction.risk_level;
            riskBadge.className = 'risk-badge';
            if (prediction.risk_level === 'Low') {
                riskBadge.classList.add('risk-low');
            } else if (prediction.risk_level === 'Medium') {
                riskBadge.classList.add('risk-medium');
            } else {
                riskBadge.classList.add('risk-high');
            }

            // Prediction text
            const title = document.getElementById('predictionTitle');
            const subtitle = document.getElementById('predictionSubtitle');
            
            if (prediction.churn_prediction === 1) {
                title.textContent = '⚠️ Customer Will Likely CHURN';
                subtitle.textContent = 'Take immediate action to retain this customer';
            } else {
                title.textContent = '✅ Customer Will Likely STAY';
                subtitle.textContent = 'Customer appears satisfied with current service';
            }

            // Stats
            document.getElementById('churnProbability').textContent = 
                (prediction.churn_probability * 100).toFixed(0) + '%';
            document.getElementById('churnPrediction').textContent = 
                prediction.churn_prediction === 1 ? 'CHURN' : 'STAY';
            document.getElementById('modelVersion').textContent = data.model_version;

            // Features
            const featuresList = document.getElementById('featuresList');
            featuresList.innerHTML = data.features_used
                .map(f => `<span class="feature-tag">${f}</span>`)
                .join('');

            // Show result
            resultSection.classList.add('show');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
