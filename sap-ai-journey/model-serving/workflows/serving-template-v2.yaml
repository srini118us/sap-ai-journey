apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: churn-serving-v2
  annotations:
    scenarios.ai.sap.com/description: "Serve customer churn prediction model v2"
    scenarios.ai.sap.com/name: "churn-serving-v2"
    executables.ai.sap.com/description: "Churn prediction REST API v2"
    executables.ai.sap.com/name: "churn-server-v2"
  labels:
    scenarios.ai.sap.com/id: "churn-serving-v2"
    ai.sap.com/version: "1.0.0"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    kind: "InferenceService"
    metadata:
      labels: |
        ai.sap.com/resourcePlan: starter
      annotations: |
        autoscaling.knative.dev/minScale: "1"
    spec: |
      predictor:
        containers:
          - name: kserve-container
            image: docker.io/srini117us/churn-serving:v2
            ports:
              - containerPort: 8080
                protocol: TCP
