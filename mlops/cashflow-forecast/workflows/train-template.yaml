apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: cashflow-train-srini
  annotations:
    scenarios.ai.sap.com/description: "Cashflow forecasting on financial time-series data"
    scenarios.ai.sap.com/name: "cashflow-forecast"
    executables.ai.sap.com/description: "Train cashflow forecasting model from S3-backed dataset"
    executables.ai.sap.com/name: "cashflow-train-executable"
    artifacts.ai.sap.com/trained_model.kind: "model"
  labels:
    scenarios.ai.sap.com/id: "cashflow-forecast"
    ai.sap.com/version: "0.2.0"

spec:
  imagePullSecrets:
    - name: docker-hub-srini117us
  entrypoint: train-pipeline
  arguments:
    parameters:
      - name: model_type
        value: "linear"
  templates:
    - name: train-pipeline
      inputs:
        artifacts:
          - name: training_data
            path: /app/data
        parameters:
          - name: model_type
      outputs:
        artifacts:
          - name: trained_model
            path: /app/output
            archive:
              none: {}
      container:
        image: docker.io/srini117us/cashflow-train:0.2
        command: ["python", "/app/train.py"]
        env:
          - name: MODEL_TYPE
            value: "{{inputs.parameters.model_type}}"
          - name: DATA_DIR
            value: "/app/data"
          - name: OUTPUT_DIR
            value: "/app/output"