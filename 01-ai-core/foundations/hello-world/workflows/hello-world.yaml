apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: hello-world-pipeline
  annotations:
    scenarios.ai.sap.com/description: "My first AI Core pipeline"
    scenarios.ai.sap.com/name: "hello-world"
    executables.ai.sap.com/description: "Hello World Execution"
    executables.ai.sap.com/name: "hello-world-exec"
  labels:
    scenarios.ai.sap.com/id: "hello-world"
    ai.sap.com/version: "1.0.0"
spec:
  entrypoint: main
  templates:
    - name: main
      container:
        image: python:3.9-slim
        command: ["python", "-c"]
        args: ["print('Hello from SAP AI Core!')"]
