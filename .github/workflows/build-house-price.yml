name: Build and Push House Price Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'house-price-tutorial/**'
      - '.github/workflows/build-house-price.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./house-price-tutorial
          file: ./house-price-tutorial/Dockerfile
          push: true
          tags: |
            docker.io/srini117us/house-price:01
            docker.io/srini117us/house-price:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
